spring.application.name=social-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

logging.level.root=INFO
logging.level.com.social.backend=INFO

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Upload config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Storage
storage.type=${STORAGE_TYPE:local}

storage.local.upload-dir=${STORAGE_LOCAL_UPLOAD_DIR:uploads}
storage.local.avatars-dir=${STORAGE_LOCAL_AVATARS_DIR:uploads/avatars}
storage.local.posts-dir=${STORAGE_LOCAL_POSTS_DIR:uploads/posts}

# Cloudinary (NO valori hardcoded!)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Virtual Threads (Java 21) — ogni richiesta HTTP usa un virtual thread leggero
spring.threads.virtual.enabled=true