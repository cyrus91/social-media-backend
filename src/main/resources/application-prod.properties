# PostgreSQL (Neon)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# AI
ai.provider=${AI_PROVIDER:groq}
ai.groq.api-key=${GROQ_API_KEY}
ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1}

# Resend Email
resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL:noreply@cirodattilo-app.site}

# Frontend URL
app.frontend-url=${FRONTEND_URL:https://social-media-frontend-mu-neon.vercel.app}

# Jackson ? serializza date come ISO string invece di array
spring.jackson.serialization.write-dates-as-timestamps=false
# Timezone UTC ? garantisce che tutti i timestamp abbiano 'Z' finale
spring.jackson.time-zone=UTC

# Redis (Upstash)
redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
redis.password=${REDIS_PASSWORD}
redis.ssl=${REDIS_SSL:true}
# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Koyeb reverse proxy, forza https nelle redirect URI OAuth2
server.forward-headers-strategy=framework

# Swagger disabilitato in produzione
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false