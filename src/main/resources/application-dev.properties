# MySQL locale (fallback se non hai env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/socialdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AI
ai.provider=${AI_PROVIDER:groq}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1}