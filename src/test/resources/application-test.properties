# Database H2 in-memory per test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Disabilita banner
spring.main.banner-mode=off

# Logging minimo
logging.level.root=ERROR
logging.level.com.social.backend=INFO

# JWT
jwt.secret=your-super-secret-jwt-key-change-this-in-production-min-256-bits
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# App URLs
app.frontend-url=http://localhost:3000
app.base-url=http://localhost:8080

# Storage (local, non cloudinary)
storage.type=local
storage.local.upload-dir=uploads
storage.local.avatars-dir=uploads/avatars
storage.local.posts-dir=uploads/posts

# Redis (dummy per test - le classi che lo usano hanno lazy init o i test sono unit test con mock)
redis.host=localhost
redis.port=6379
redis.password=
redis.ssl=false
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Resend email (dummy per test - non vengono mandate email reali)
resend.api-key=test-dummy-key
resend.from-email=test@test.com

# AI provider (groq di default, api-key dummy)
ai.provider=groq
ai.groq.api-key=test-dummy-key
ai.groq.model=llama-3.1-8b-instant
ai.groq.url=https://api.groq.com/openai/v1

# Cloudinary (vuoto, storage e' local nei test)
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=

# Google OAuth2 (dummy per test - necessario per far partire il context)
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub